[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-video-mvp"
version = "0.1.0"
description = "MVP para generar videos verticales de noticias con portada, narrador por gestos y TTS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "moviepy>=2.1.2",
  "numpy>=1.26.4",
  "Pillow>=10.4.0",
  "pyttsx3>=2.98",
]

[project.optional-dependencies]
kokoro = [
  "kokoro-onnx>=0.4.9",
  "soundfile>=0.13.1",
]

[project.scripts]
news-video-mvp = "news_video_mvp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
